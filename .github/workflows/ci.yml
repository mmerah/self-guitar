name: CI

# Once per change: pull requests, and pushes to main (merges).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: node scripts/third-party.mjs --check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser for Playwright (CI only: local runs use an installed Chromium).
      - run: npx playwright install --with-deps chromium
      - name: Self-hosted build + e2e
        run: npm run test:e2e
        env:
          BUILD_SHA: ${{ github.sha }}
      - name: Static demo build + e2e
        run: npm run test:e2e:demo
        env:
          BUILD_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
