name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: node scripts/third-party.mjs --check
      - uses: actions/configure-pages@v5
      # https://<owner>.github.io/ for a <owner>.github.io repository, else
      # https://<owner>.github.io/<repo>/.
      - name: Base path
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [ "${repo,,}" = "$owner.github.io" ]; then base=""; else base="/$repo"; fi
          echo "BASE_PATH=$base" >> "$GITHUB_ENV"
      - run: npm run build:demo
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      # Serve _app/ as is (no Jekyll processing).
      - run: touch build-demo/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build-demo

  deploy:
    needs: build
    # Forks build the demo but do not publish it.
    if: github.repository == 'mmerah/self-guitar'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
