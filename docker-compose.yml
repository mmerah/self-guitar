services:
  self-guitar:
    build:
      context: .
      # Serve the app under a sub-path (e.g. BASE_PATH=/guitar in .env); empty: at /.
      args:
        BASE_PATH: ${BASE_PATH:-}
    image: self-guitar:latest
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - self-guitar-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000${BASE_PATH:-}/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  self-guitar-data:
